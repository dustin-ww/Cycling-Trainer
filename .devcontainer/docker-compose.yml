services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:24
    command: sleep infinity
    volumes:
      - ..:/workspaces/Cycling-Trainer:cached
      - node_modules:/workspaces/Cycling-Trainer/node_modules
    environment:
      DATABASE_URL: postgres://dev:dev@db:5432/cycling
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: cycling
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d cycling"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  node_modules:
  pgdata: